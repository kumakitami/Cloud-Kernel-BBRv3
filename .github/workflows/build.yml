name: Build Cloud Kernel Packages

run-name: >-
  ${{ format('Build Cloud Kernel {0} ({1}){2}',
  github.event.client_payload.kernel_version || inputs.kernel_version,
  (github.event.action == 'trigger-x86_64-build' && 'x86_64') || (github.event.action == 'trigger-arm64-build' && 'arm64') || inputs.arch,
  (github.event.client_payload.diagnostic_build == true || github.event.client_payload.diagnostic_build == 'true' || inputs.diagnostic_build == 'true') && ' [diagnostic]' || '') }}

on:
  repository_dispatch:
    types: [trigger-x86_64-build, trigger-arm64-build]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.12.30"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
      localversion:
        description: "Kernel suffix (CONFIG_LOCALVERSION, leave empty to disable)"
        required: false
        default: "cloudy"
        type: string
      skip_cache:
        description: "Skip compiler caches"
        required: false
        default: false
        type: boolean
      diagnostic_build:
        description: "Enable verbose diagnostics for DEB, RPM, APK, and Arch builds"
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-24.04
    outputs:
      kernel_version: ${{ steps.parameters.outputs.KERNEL_VERSION }}
      kernel_series: ${{ steps.parameters.outputs.KERNEL_SERIES }}
      kernel_major_version: ${{ steps.parameters.outputs.KERNEL_MAJOR_VERSION }}
      localversion: ${{ steps.parameters.outputs.LOCALVERSION }}
      localversion_display: ${{ steps.parameters.outputs.LOCALVERSION_DISPLAY }}
      skip_cache: ${{ steps.parameters.outputs.SKIP_CACHE }}
      diagnostic_build: ${{ steps.parameters.outputs.DIAGNOSTIC_BUILD }}
      arch: ${{ steps.parameters.outputs.ARCH }}
      debian_arch: ${{ steps.parameters.outputs.DEBIAN_ARCH }}
      rpm_arch: ${{ steps.parameters.outputs.RPM_ARCH }}
      alpine_arch: ${{ steps.parameters.outputs.ALPINE_ARCH }}
      runner: ${{ steps.parameters.outputs.RUNNER }}
      tag_suffix: ${{ steps.parameters.outputs.TAG_SUFFIX }}
    steps:
      - name: Prepare Build Parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_VERSION: ${{ github.event.client_payload.kernel_version }}
          DISPATCH_LOCALVERSION: ${{ github.event.client_payload.localversion }}
          DISPATCH_DIAGNOSTIC: ${{ github.event.client_payload.diagnostic_build }}
          INPUT_VERSION: ${{ inputs.kernel_version }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_LOCALVERSION: ${{ inputs.localversion }}
          INPUT_SKIP_CACHE: ${{ inputs.skip_cache }}
          INPUT_DIAGNOSTIC: ${{ inputs.diagnostic_build }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            KERNEL_VERSION="$DISPATCH_VERSION"
            case "$EVENT_ACTION" in
              trigger-x86_64-build) ARCH=x86_64 ;;
              trigger-arm64-build) ARCH=arm64 ;;
              *)
                echo "Unknown repository_dispatch event type: $EVENT_ACTION" >&2
                exit 1
                ;;
            esac
            SKIP_CACHE=false
            DIAGNOSTIC_BUILD=${DISPATCH_DIAGNOSTIC:-false}
            LOCALVERSION=${DISPATCH_LOCALVERSION:-cloudy}
          else
            KERNEL_VERSION="$INPUT_VERSION"
            ARCH="$INPUT_ARCH"
            LOCALVERSION="$INPUT_LOCALVERSION"
            SKIP_CACHE="$INPUT_SKIP_CACHE"
            DIAGNOSTIC_BUILD="$INPUT_DIAGNOSTIC"
          fi

          if ! [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid kernel version: $KERNEL_VERSION" >&2
            exit 1
          fi

          case "$DIAGNOSTIC_BUILD" in
            true|false) ;;
            *)
              echo "Invalid diagnostic build value: $DIAGNOSTIC_BUILD" >&2
              exit 1
              ;;
          esac
          LOCALVERSION=${LOCALVERSION#-}
          if [ -n "$LOCALVERSION" ] && ! printf '%s' "$LOCALVERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "Invalid localversion: $LOCALVERSION" >&2
            exit 1
          fi

          case "$SKIP_CACHE" in
            true|false) ;;
            *)
              echo "Invalid skip cache value: $SKIP_CACHE" >&2
              exit 1
              ;;
          esac
          case "$ARCH" in
            x86_64)
              DEBIAN_ARCH=amd64
              RPM_ARCH=x86_64
              ALPINE_ARCH=x86_64
              RUNNER=ubuntu-24.04
              TAG_SUFFIX=""
              ;;
            arm64)
              DEBIAN_ARCH=arm64
              RPM_ARCH=aarch64
              ALPINE_ARCH=aarch64
              RUNNER=ubuntu-24.04-arm
              TAG_SUFFIX=-arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          KERNEL_SERIES=${KERNEL_VERSION%.*}
          KERNEL_MAJOR_VERSION=${KERNEL_VERSION%%.*}
          if [ -n "$LOCALVERSION" ]; then
            LOCALVERSION_DISPLAY="-$LOCALVERSION"
          else
            LOCALVERSION_DISPLAY="(none)"
          fi

          echo "Using kernel version: $KERNEL_VERSION"
          echo "Using kernel series: $KERNEL_SERIES"
          echo "Using architecture: $ARCH (Debian: $DEBIAN_ARCH, RPM: $RPM_ARCH, Alpine: $ALPINE_ARCH)"
          echo "Using kernel localversion: $LOCALVERSION_DISPLAY"
          echo "Using skip cache: $SKIP_CACHE"
          echo "Using diagnostic build: $DIAGNOSTIC_BUILD"
          {
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "KERNEL_SERIES=$KERNEL_SERIES"
            echo "KERNEL_MAJOR_VERSION=$KERNEL_MAJOR_VERSION"
            echo "LOCALVERSION=$LOCALVERSION"
            echo "LOCALVERSION_DISPLAY=$LOCALVERSION_DISPLAY"
            echo "SKIP_CACHE=$SKIP_CACHE"
            echo "DIAGNOSTIC_BUILD=$DIAGNOSTIC_BUILD"
            echo "ARCH=$ARCH"
            echo "DEBIAN_ARCH=$DEBIAN_ARCH"
            echo "RPM_ARCH=$RPM_ARCH"
            echo "ALPINE_ARCH=$ALPINE_ARCH"
            echo "RUNNER=$RUNNER"
            echo "TAG_SUFFIX=$TAG_SUFFIX"
          } >> "$GITHUB_OUTPUT"

  prepare-source:
    name: Prepare Patched Source for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: prepare
    steps:
      - name: Install Source Preparation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git jq patch quilt bison bc flex rsync cmake pkg-config \
            libncurses-dev libdw-dev libelf-dev zlib1g-dev dpkg-dev xz-utils zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Build and Install Pahole
        run: sudo bash .github/scripts/build_pahole.sh "$RUNNER_TEMP/dwarves-v1.31"

      - name: Prepare Shared Kernel Source
        env:
          KERNEL_LOCALVERSION: ${{ needs.prepare.outputs.localversion }}
        run: |
          bash .github/scripts/prepare_kernel_source.sh \
            "${{ needs.prepare.outputs.kernel_version }}" \
            "${{ needs.prepare.outputs.arch }}" \
            "$RUNNER_TEMP/kernel-work"

      - name: Create Prepared Source Archive
        run: |
          tar --zstd -cf \
            "linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst" \
            -C "$RUNNER_TEMP/kernel-work" linux
          cp "$RUNNER_TEMP/kernel-work/build-manifest.json" .
          cp "$RUNNER_TEMP/kernel-work/linux/.config" \
            "linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config"

      - name: Upload Prepared Source
        uses: actions/upload-artifact@v7
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: |
            linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst
            build-manifest.json
            linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config
          if-no-files-found: error
          retention-days: 3

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ needs.prepare.outputs.arch }}
          path: build-manifest.json
          if-no-files-found: error

  build-kernel:
    name: Compile Kernel Once for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source]
    steps:
      - name: Install Kernel Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake curl git patch jq openssl pkg-config quilt \
            libncurses-dev libssl-dev libelf-dev libdw-dev zlib1g-dev libudev-dev \
            libpci-dev libcap-dev libpcre2-dev libcurl4-openssl-dev bison bc flex \
            rsync kmod cpio xz-utils zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Prepared Source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared

      - name: Restore Kernel Compiler Cache
        if: needs.prepare.outputs.skip_cache != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: kernel-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.debian_arch }}

      - name: Compile Kernel
        env:
          KBUILD_BUILD_USER: cloudpassenger
          KBUILD_BUILD_HOST: cloud-kernel-bbrv3
          KERNEL_LOCALVERSION: ${{ needs.prepare.outputs.localversion }}
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_kernel_build() {
            bash .github/scripts/build_kernel.sh \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ needs.prepare.outputs.arch }}" \
              "prepared/linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst" \
              dist/kernel
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_kernel_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics
          mkdir -p "$diagnostic_dir"
          set +e
          run_kernel_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -nE 'BTF|pahole|resolve_btfids|FAILED|Failed|Error [0-9]+|Killed|out of memory' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            tail -n 500 "$diagnostic_dir/build.log"
            exit "$build_status"
          fi

      - name: Collect Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          mkdir -p kernel-build-diagnostics
          cp .build/kernel/${{ needs.prepare.outputs.arch }}/linux/.config \
            kernel-build-diagnostics/final.config 2>/dev/null || true
          cp .build/kernel/${{ needs.prepare.outputs.arch }}/linux/include/config/auto.conf \
            kernel-build-diagnostics/auto.conf 2>/dev/null || true
          ccache --show-stats > kernel-build-diagnostics/ccache.log 2>&1 || true
          if [ -f kernel-build-diagnostics/build.log ]; then
            zstd -T0 -10 --rm kernel-build-diagnostics/build.log
          fi

      - name: Upload Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v7
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: dist/kernel/compiled-kernel.tar.zst
          if-no-files-found: error
          retention-days: 3

  build-deb:
    name: Build Debian Packages for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source, build-kernel]
    outputs:
      build_time: ${{ steps.build_time.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Install Debian Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex jq libelf-dev libssl-dev pkg-config \
            kmod rsync cpio xz-utils dpkg-dev zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Compiled Kernel
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: compiled

      - name: Build Debian Kernel Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_deb_build() {
            bash .github/scripts/build_deb.sh \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ needs.prepare.outputs.arch }}" \
              generic \
              compiled/compiled-kernel.tar.zst \
              dist/deb/generic
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_deb_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics/deb-generic
          mkdir -p "$diagnostic_dir"
          set +e
          run_deb_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -nEi 'fatal|error:|failed|killed|no space|undefined reference' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            tail -n 500 "$diagnostic_dir/build.log"
            exit "$build_status"
          fi

      - name: Collect Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir=kernel-build-diagnostics/deb-generic
          mkdir -p "$diagnostic_dir"
          cp .build/deb/generic-${{ needs.prepare.outputs.arch }}/linux/.config \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-deb-generic-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/deb-generic/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ needs.prepare.outputs.arch }}
          path: |
            dist/deb/generic/*.deb
            dist/deb/generic/*.config
          if-no-files-found: error

      - name: Record Build Time
        id: build_time
        run: |
          BUILD_TIMESTAMP=$(date -Is)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"

  validate-deb:
    name: Validate DEB on ${{ matrix.name }} for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, build-deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
          - name: Debian 13
            image: debian:13-slim
          - name: Ubuntu 20.04
            image: ubuntu:20.04
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    steps:
      - name: Checkout Installer Source Code
        uses: actions/checkout@v7

      - name: Download Debian Packages
        uses: actions/download-artifact@v8
        with:
          name: release-deb-${{ needs.prepare.outputs.arch }}
          path: packages

      - name: Validate Installer Package Lifecycle
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env DEBIAN_FRONTEND=noninteractive \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              apt-get update
              /workspace/.github/scripts/test_install_kernel_deb.sh /workspace/packages
            '

  create-release:
    name: Create Multi-Format Release
    needs: [prepare, prepare-source, build-deb, validate-deb]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare-source.result == 'success' &&
      needs.build-deb.result == 'success' &&
      needs.validate-deb.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.prepare.outputs.arch }}
          path: release-assets
          merge-multiple: true

      - name: Add Prepared Source to Release Assets
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared-source

      - name: Select Prepared Source Archive
        run: |
          source_archive="linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst"
          test -s "prepared-source/$source_archive"
          install -Dm644 "prepared-source/$source_archive" "release-assets/$source_archive"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}${{ needs.prepare.outputs.tag_suffix }}
          name: Cloud Kernel ${{ needs.prepare.outputs.kernel_version }} with BBRv3 (${{ needs.prepare.outputs.arch }})
          body: |
            ## English

            **Kernel version:** `${{ needs.prepare.outputs.kernel_version }}`

            **Build time:** `${{ needs.build-deb.outputs.build_time }}`

            **Build information:**
            - **Architecture:** `${{ needs.prepare.outputs.arch }}`
            - **Kernel type:** `cloud`
            - **Kernel suffix (LOCALVERSION):** `${{ needs.prepare.outputs.localversion_display }}`
            - **Package targets:** Debian/Ubuntu `.deb`, generic Fedora/Enterprise Linux `.rpm`, generic Alpine Linux `.apk`, and Arch Linux `.pkg.tar.zst` (x86_64 only)
            - **Validated targets:** Fedora 43/44, Enterprise Linux 9/10, Alpine Linux 3.21/3.22/3.23/3.24, and Arch Linux x86_64
            - **Corresponding source:** `linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst` (covered by `SHA256SUMS.asc`); it includes the project license/notice bundle and resolved Debian/XanMod notices under `linux/Documentation/cloud-kernel-bbrv3/`.
            - **Applied patches:**
              - `Debian Patches Collection` (from [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/))
              - `BBR V3` (from [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches))
              - `BBRPlus` (modified from [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable))

            **Important:** Secure Boot is not currently supported. Keep the distribution kernel installed as a recovery option. This VPS configuration disables USB/HID, so Arch Linux `mkinitcpio` may warn that `usbhid` is missing; do not use this kernel where boot-time USB keyboard input is required.

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk

            # Arch Linux (x86_64 only)
            sudo pacman -Syu
            sudo pacman -U ./linux-cloud-bbrv3-[0-9]*.pkg.tar.zst ./linux-cloud-bbrv3-headers-*.pkg.tar.zst
            ```

            ---

            ## 中文

            **内核版本：** `${{ needs.prepare.outputs.kernel_version }}`

            **构建时间：** `${{ needs.build-deb.outputs.build_time }}`

            **构建信息：**
            - **架构：** `${{ needs.prepare.outputs.arch }}`
            - **内核类型：** `cloud`
            - **内核后缀 (LOCALVERSION)：** `${{ needs.prepare.outputs.localversion_display }}`
            - **软件包目标：** Debian/Ubuntu `.deb`、通用 Fedora/Enterprise Linux `.rpm`、通用 Alpine Linux `.apk`，以及 Arch Linux `.pkg.tar.zst`（仅 x86_64）
            - **验证目标：** Fedora 43/44、Enterprise Linux 9/10、Alpine Linux 3.21/3.22/3.23/3.24，以及 Arch Linux x86_64
            - **对应源代码：** `linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}-source.tar.zst`（由 `SHA256SUMS.asc` 覆盖签名）；其中包含位于 `linux/Documentation/cloud-kernel-bbrv3/` 的项目许可证/通知文件集合及已解析的 Debian/XanMod 通知。
            - **应用补丁：**
              - `Debian 补丁集合`（来自 [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/)）
              - `BBR V3`（来自 [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches)）
              - `BBRPlus`（修改自 [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable)）

            **重要提示：** 当前不支持 Secure Boot。请保留发行版原有内核作为恢复选项。本 VPS 配置禁用了 USB/HID，因此 Arch Linux `mkinitcpio` 可能提示缺少 `usbhid`；需要在启动阶段使用 USB 键盘输入的机器不应使用此内核。

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk

            # Arch Linux（仅 x86_64）
            sudo pacman -Syu
            sudo pacman -U ./linux-cloud-bbrv3-[0-9]*.pkg.tar.zst ./linux-cloud-bbrv3-headers-*.pkg.tar.zst
            ```
          files: |
            release-assets/*.deb
            release-assets/*.config
            release-assets/*.json
            release-assets/SHA256SUMS
